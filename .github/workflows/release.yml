name: Build Windows installer

# Builds the Windows installer and publishes it as a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write # needed to create the release

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Node.js setup
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Rust setup
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: Install app dependencies
              run: npm ci

            - name: Build and publish the installer
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # signs the update so installed apps can verify it (Settings → Secrets → Actions)
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  # __VERSION__ is replaced with the app version from tauri.conf.json
                  tagName: v__VERSION__
                  releaseName: "WindowPet v__VERSION__ (custom avatar edition)"
                  releaseBody: |
                      Desktop pet with a custom animated avatar that walks on your taskbar.

                      **Install:** download `WindowPet_*_x64-setup.exe` below and run it (no admin needed).
                      Windows may say "Windows protected your PC" because the app isn't code-signed:
                      click **More info → Run anyway**. Then open WindowPet → Pet Shop → add **My Avatar**,
                      and turn on Settings → Auto start-up.

                      **Shortcuts:** Ctrl+Alt+S sleep · W work · G game · M movie · D dance · H hi ·
                      F follow cursor · P focus timer · A angry · E emotional · T attention · C snack · X hide · N normal

                      **Cheer it up:** rub the cursor over it to pet it, or give it a snack.

                      **Already installed?** From v1.2.0 on, WindowPet updates itself: it tells you when a
                      new version is out, and Settings asks to install it.
                  releaseDraft: false
                  prerelease: false
