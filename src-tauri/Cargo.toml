[package]
name = "window_pet"
version = "1.2.0"
description = "Window Pet"
authors = ["SeakMengs"]
license = "MIT"
repository = "https://github.com/SeakMengs/WindowPet"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
tauri = { version = "1.5.4", features = [ "protocol-asset", "process-relaunch", "updater", "window-all", "dialog-all", "fs-all", "path-all", "macos-private-api", "system-tray", "shell-open", "global-shortcut-all"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
mouse_position = "0.1.3"
log = "^0.4.20"
open = "5.0.1"
# weather lookups (already part of the dependency tree through Tauri)
reqwest = "0.11"
tokio = "1.35.1"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

# idle time, foreground app and "now playing" for the pet's awareness features
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage", "System_UserProfile", "Win32_Networking_WinInet", "Win32_System_Power", "Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
